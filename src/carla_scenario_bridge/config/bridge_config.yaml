# carla-scenario-bridge configuration
#
# Every key here is read. Precedence is: environment > this file > built-in default.
# The launch files set CARLA_HOST / CARLA_PORT / SSV2_PORT per run, so those override
# whatever is written below.
#
# A missing file is fine -- everything has a default. A malformed one is fatal, so that a
# typo cannot silently run the scenario with settings you believe you changed.

# CARLA connection. Overridden by CARLA_HOST / CARLA_PORT.
carla:
  host: "localhost"
  port: 2000
  # Initialize waits this long for a CARLA that is gone (restarting: ~182 s headless at
  # Epic) before failing the scenario. docs/design/failure-and-frame-budget.md
  reconnect_wait_seconds: 240

# SSv2 ZMQ server. Overridden by SSV2_PORT.
ssv2:
  port: 5555

# The scenario ego.
ego:
  # CARLA role_name given to the ego. acb_bridge finds the vehicle it serves by this, so it
  # must match that bridge's `vehicle_name` parameter in the ego's ROS domain.
  role_name: "hero"

# SSv2 asset key -> CARLA blueprint.
#
# SSv2 asset keys are not CARLA blueprint names in general. A key that already names a
# blueprint (e.g. vehicle.volkswagen.t2) passes straight through and needs no entry here;
# anything else needs a translation, or the spawn falls back to a default for its kind and
# warns.
blueprint_map:
  sample_vehicle: "vehicle.tesla.model3"

# Map directory name -> CARLA town.
#
# The town is normally recovered from the scenario's lanelet2_map_path, whose final directory
# is the town name. Add an entry only for maps that break that convention.
map_alias: {}
#  kashiwanoha: "Town01"

# Entities whose controller is `agent` (background AVs, each driven by its own Autoware):
# the bridge spawns the vehicle with role_name = the entity name and forwards the scenario's
# goals to the agent registered with this agent relay under that name
# (docs/design/scenario-authoring.md). The ROS parameter `agent_relay` overrides it;
# simulation.launch.xml points it at the relay it starts. Background AVs used to be listed
# here (`background_avs`); that key is now refused -- declare them in the scenario.
agent_relay: "tcp://localhost:5560"

# Telling the sensor bridges before we despawn something.
#
# acb attaches sensors to the vehicles this bridge spawns and listens to their streams, so
# it owns those stream sessions. Despawning the vehicle destroys the sensors with it, and a
# sensor destroyed while still being listened to leaves that client retrying a dead stream
# forever -- CARLA 0.9.16 answers at ~48,000 "Invalid session: no stream available with id
# N" a second, until the server segfaults.
#
# Neither side can fix that alone: the listener cannot unsubscribe after the fact, and this
# bridge cannot stop a stream it never subscribed to. So we announce first and wait briefly.
# See src/autoware_carla_bridge/docs/issues/015-*.
sensor_release:
  enabled: true
  # Ours to bind. Sensor bridges connect to these; acb takes the same two as ROS
  # parameters (release_notify_endpoint, release_ack_endpoint).
  notify_endpoint: "tcp://127.0.0.1:5556"
  ack_endpoint: "tcp://127.0.0.1:5557"
  # Paid once per despawned entity that nobody acknowledges -- an entity with no sensor
  # bridge, which is every entity in a run with no Autoware. Long enough for a local round
  # trip, short enough not to matter to a scenario.
  timeout_ms: 300

# CARLA's view of the ego's collisions (roadmap 014, gap 3). Default true.
#
# Attaches a sensor.other.collision to the ego at spawn. Every contact is logged at WARN --
# at most once a second per other actor, with the SSv2 frame, the other actor's SSv2 name
# (or CARLA type and id), and the normal impulse -- and at the end of the run (ego despawn
# or the next Initialize) an INFO table lists each other actor's first frame, contact count
# and max impulse.
#
# DIAGNOSTIC ONLY. SSv2's CollisionCondition stays the verdict and nothing here fails a
# request. SSv2 judges collisions from declared bounding boxes; CARLA from PhysX colliders
# (NPCs are kinematic but keep theirs), so the two can disagree. SSv2 does not report its
# verdict to the simulator, so compare the summary against the run's JUnit result by hand.
collision_monitor: true

# CARLA ticks per SSv2 frame. 2 is the default: the SSv2 frame is delivered in two CARLA
# ticks at half the step, so the scenario's timeline is unchanged while sensors and control
# are serviced twice as often. Set to 1 for the historical one-tick-per-frame behaviour.
#
# Why 2. The ego IMU fires once per tick, so at a 0.1 s frame its samples sit 100 ms apart
# against gyro_odometer's 0.2 s tolerance -- one dropped sample trips it, and the resulting
# localization wobble is what made every run after a stack's first fail about half the time.
# Interleaved A/B across five stacks: later runs pass 7 of 7 real drives at 2 against 2 of 10
# at 1, with lateral tracking spread 0.016-0.135 against 0.211-1.564 and no overlap
# (p = 0.003). See src/autoware_carla_bridge/docs/issues/016.
#
# Raising this divides the CARLA time step and ticks that many times per frame, so the
# scenario's timeline is unchanged while control commands are picked up more often. Autoware
# publishes control at 20 Hz on its own clock and nothing synchronises it to the frame, so a
# command waits up to a full step before it can take effect -- measured at ~200 ms end to
# end, of which one tick is irreducible. At 2 substeps that worst-case wait halves.
#
# Costs, before turning it on:
#   - sensors configured to publish per frame rather than on a timer fire twice as often.
#     The ego LiDAR is one (sensor_tick: 0.0), so its point clouds double to 20 Hz. That
#     suits the sensor -- rotation_frequency is 20 Hz, so each scan becomes exactly one
#     rotation instead of two -- but it doubles the point cloud rate into Autoware.
#   - physics runs at the finer delta: more accurate, more expensive.
#
# See src/autoware_carla_bridge/docs/issues/016 for the latency measurements.
substeps: 2

# Target CARLA tick, which takes precedence over `substeps`: the bridge ticks
# round(step_time / carla_tick_seconds) times per SSv2 frame (at least once), so the tick
# stays 0.05 s whatever global_frame_rate SSv2 runs at -- 2 ticks per frame at 10 Hz, 1 at
# 20 Hz. The ego LiDAR fires per tick at a 20 Hz rotation, so a 0.05 s tick is one full
# sweep per scan; a fixed `substeps: 2` at 20 Hz would give 0.025 s ticks and half-rotation
# scans at 40 Hz. Remove this line to go back to the fixed `substeps` above.
carla_tick_seconds: 0.05

# CARLA's Traffic Manager drives every scenario entity whose controller is
# `simulator_autopilot` (docs/design/scenario-authoring.md). csb runs it in its own process
# and ticks it with the world, synchronously; `seed` is applied at every Initialize so the
# simulator-driven traffic repeats run to run.
traffic_manager:
  port: 8000
  seed: 2017
