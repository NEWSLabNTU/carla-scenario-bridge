# UC-ACC-001-0001_Preceding_vehicle_partial_deceleration -- AWF ODD use case, adapted to the CARLA Town01 map of carla-scenario-bridge.
#
# Source: https://github.com/autowarefoundation/odd-usecase-scenario
#         scenarios/UC-ACC-001-0001_Preceding_vehicle_partial_deceleration.yaml at commit b258e781fdd487b866c3ecc2912e41239b47fef2
# Copyright the Autoware Foundation contributors; licensed under the Apache License 2.0
# (http://www.apache.org/licenses/LICENSE-2.0). Modified by carla-scenario-bridge:
#   - RoadNetwork/LogicFile: maps/Town01.osm -> $(env CARLA_MAPS)/Town01 (our converted
#     Town01, the TUM carla-autoware-bridge pack); SceneGraphFile (maps/dummy.pcd) dropped,
#     as in this repo's other scenarios.
#   - laneId 1071 -> 5230 everywhere, s and offset unchanged. AWF's Town01.osm and ours share
#     no lanelet ids; their lanelet 1071 and our 5230 are the same CARLA lane (road 4, lane
#     -1, ROS y ~ -133.4, heading +x), both 224.22 m long and starting at x = 101.42, so
#     every s maps one to one; projected through each map's projector, their bounds agree
#     to 0.01 m and match CARLA's lane centre. See ../../README.md.
#   - The ego's vehicle placeholders (__ego_dimensions_*, __ego_center_*), which the AWF
#     evaluator fills with its vehicle's, are set to this project's ego (acb_vehicle,
#     CARLA's vehicle.tesla.model3): 4.792 x 2.163 x 1.488 m, centre 1.532 m ahead of the
#     rear axle, 0.744 m up. The upstream 4 x 2 m box centred on the rear axle put the CARLA
#     car 1.39 m behind the pose SSv2 initialized Autoware's localization at, and every
#     variant failed before engage (see ../../README.md).
# Everything else is the upstream file as published.
ScenarioModifiers:
  ScenarioModifier:
    - name: __tier4_modifier_vxi_ego
      type: double
      list:
        - 5.556
        - 8.333
        - 9.722
    - name: __tier4_modifier_vxi_npc0
      type: double
      list:
        - 2.778
        - 4.167
        - 5.556
    - name: __tier4_modifier_vx_target_npc0
      type: double
      list:
        - 1.389
        - 1.944
        - 2.778
OpenSCENARIO:
  FileHeader:
    revMajor: 1
    revMinor: 1
    date: '2025-09-18T02:37:35.786Z'
    description: >-
      Confirm that the ADS is capable of keeping a safe distance from a
      preceding vehicle that decelerates partially.
    author: ''
  ParameterDeclarations:
    ParameterDeclaration:
      - name: __ego_dimensions_length__
        parameterType: double
        value: '4.792'
      - name: __ego_dimensions_width__
        parameterType: double
        value: '2.163'
      - name: __ego_dimensions_height__
        parameterType: double
        value: '1.488'
      - name: __ego_center_x__
        parameterType: double
        value: '1.532'
      - name: __ego_center_y__
        parameterType: double
        value: '0'
      - name: __ego_center_z__
        parameterType: double
        value: '0.744'
      - name: vxi_ego
        parameterType: double
        value: __tier4_modifier_vxi_ego
      - name: vxi_npc0
        parameterType: double
        value: __tier4_modifier_vxi_npc0
      - name: vx_target_npc0
        parameterType: double
        value: __tier4_modifier_vx_target_npc0
      - name: ax_npc0
        parameterType: double
        value: '-1.5'
      - name: amin_ego
        parameterType: double
        value: '-1.5'
  CatalogLocations:
    CatalogLocation: []
  RoadNetwork:
    LogicFile:
      filepath: $(env CARLA_MAPS)/Town01
    TrafficSignals:
      TrafficSignalController: []
  Entities:
    ScenarioObject:
      - name: ego
        Vehicle:
          name: ''
          vehicleCategory: car
          BoundingBox:
            Center:
              x: $__ego_center_x__
              y: $__ego_center_y__
              z: $__ego_center_z__
            Dimensions:
              length: $__ego_dimensions_length__
              width: $__ego_dimensions_width__
              height: $__ego_dimensions_height__
          Performance:
            maxSpeed: 50
            maxAcceleration: INF
            maxDeceleration: INF
          Axles:
            FrontAxle:
              maxSteering: 0.5236
              wheelDiameter: 0.78
              trackWidth: 1.63
              positionX: 1.385
              positionZ: 0.39
            RearAxle:
              maxSteering: 0.5236
              wheelDiameter: 0.78
              trackWidth: 1.63
              positionX: 0
              positionZ: 0.39
          Properties:
            Property: []
          model3d: ''
        ObjectController:
          Controller:
            name: ''
            Properties:
              Property:
                - name: isEgo
                  value: 'true'
      - name: Npc1
        Vehicle:
          name: ''
          vehicleCategory: car
          BoundingBox:
            Center:
              x: 0
              y: 0
              z: 1.25
            Dimensions:
              length: 4
              width: 1.8
              height: 2.5
          Performance:
            maxSpeed: 50
            maxAcceleration: INF
            maxDeceleration: INF
          Axles:
            FrontAxle:
              maxSteering: 0.5236
              wheelDiameter: 0.6
              trackWidth: 1.8
              positionX: 2
              positionZ: 0.3
            RearAxle:
              maxSteering: 0.5236
              wheelDiameter: 0.6
              trackWidth: 1.8
              positionX: 0
              positionZ: 0.3
          Properties:
            Property: []
          model3d: ''
        ObjectController:
          Controller:
            name: ''
            Properties:
              Property: []
  Storyboard:
    Init:
      Actions:
        Private:
          - entityRef: ego
            PrivateAction:
              - TeleportAction:
                  Position:
                    LanePosition:
                      roadId: ''
                      laneId: '5230'
                      s: 5
                      offset: 0
                      Orientation:
                        type: relative
                        h: 0
                        p: -0.0
                        r: 0
              - RoutingAction:
                  AcquirePositionAction:
                    Position:
                      LanePosition:
                        roadId: ''
                        laneId: '5230'
                        s: 200
                        offset: 0
                        Orientation:
                          type: relative
                          h: 0
                          p: -0.0
                          r: 0
              - LongitudinalAction:
                  SpeedAction:
                    SpeedActionDynamics:
                      dynamicsDimension: time
                      value: 0
                      dynamicsShape: step
                    SpeedActionTarget:
                      AbsoluteTargetSpeed:
                        value: $vxi_ego
              - ControllerAction:
                  AssignControllerAction:
                    Controller:
                      name: ''
                      Properties:
                        Property:
                          - name: maxSpeed
                            value: $vxi_ego
    Story:
      - name: ''
        Act:
          - name: act_spawn_npc
            ManeuverGroup:
              - maximumExecutionCount: 1
                name: act_spawn_npc
                Actors:
                  selectTriggeringEntities: false
                  EntityRef:
                    - entityRef: Npc1
                Maneuver:
                  - name: ''
                    Event:
                      - name: ego_reaches_start_position
                        priority: parallel
                        Action:
                          - name: spawn_npc
                            GlobalAction:
                              EntityAction:
                                entityRef: Npc1
                                AddEntityAction:
                                  Position:
                                    LanePosition:
                                      roadId: ''
                                      laneId: '5230'
                                      s: 100
                                      offset: 0
                                      Orientation:
                                        type: relative
                                        h: 0
                                        p: -0.0
                                        r: 0
                          - name: init_npc_speed
                            PrivateAction:
                              LongitudinalAction:
                                SpeedAction:
                                  SpeedActionDynamics:
                                    dynamicsDimension: time
                                    value: 0
                                    dynamicsShape: step
                                  SpeedActionTarget:
                                    AbsoluteTargetSpeed:
                                      value: $vxi_npc0
                        StartTrigger:
                          ConditionGroup:
                            - Condition:
                                - name: ''
                                  delay: 0
                                  conditionEdge: none
                                  ByEntityCondition:
                                    TriggeringEntities:
                                      triggeringEntitiesRule: any
                                      EntityRef:
                                        - entityRef: ego
                                    EntityCondition:
                                      DistanceCondition:
                                        Position:
                                          LanePosition:
                                            roadId: ''
                                            laneId: '5230'
                                            s: 100
                                            offset: 0
                                            Orientation:
                                              type: relative
                                              h: 0
                                              p: -0.0
                                              r: 0
                                        value: 30
                                        freespace: true
                                        relativeDistanceType: longitudinal
                                        coordinateSystem: lane
                                        rule: lessOrEqual
            StartTrigger:
              ConditionGroup:
                - Condition:
                    - name: ''
                      delay: 0
                      conditionEdge: none
                      ByEntityCondition:
                        TriggeringEntities:
                          triggeringEntitiesRule: any
                          EntityRef:
                            - entityRef: ego
                        EntityCondition:
                          SpeedCondition:
                            rule: greaterThan
                            value: 0.5
          - name: act_npc_decelerates
            ManeuverGroup:
              - maximumExecutionCount: 1
                name: act_npc_decelerates
                Actors:
                  selectTriggeringEntities: false
                  EntityRef:
                    - entityRef: Npc1
                Maneuver:
                  - name: ''
                    Event:
                      - name: ego_matches_npc_speed
                        priority: parallel
                        Action:
                          - name: npc_decelerates
                            PrivateAction:
                              LongitudinalAction:
                                SpeedAction:
                                  SpeedActionDynamics:
                                    dynamicsDimension: rate
                                    value: $ax_npc0
                                    dynamicsShape: linear
                                  SpeedActionTarget:
                                    AbsoluteTargetSpeed:
                                      value: $vx_target_npc0
                        StartTrigger:
                          ConditionGroup:
                            - Condition:
                                - name: ''
                                  delay: 0
                                  conditionEdge: none
                                  ByEntityCondition:
                                    TriggeringEntities:
                                      triggeringEntitiesRule: any
                                      EntityRef:
                                        - entityRef: ego
                                    EntityCondition:
                                      RelativeSpeedCondition:
                                        entityRef: Npc1
                                        direction: longitudinal
                                        rule: lessOrEqual
                                        value: 0.05
            StartTrigger:
              ConditionGroup:
                - Condition:
                    - name: ''
                      delay: 0
                      conditionEdge: none
                      ByValueCondition:
                        StoryboardElementStateCondition:
                          state: endTransition
                          storyboardElementType: act
                          storyboardElementRef: act_spawn_npc
          - name: _EndCondition
            ManeuverGroup:
              - maximumExecutionCount: 1
                name: ''
                Actors:
                  selectTriggeringEntities: false
                  EntityRef:
                    - entityRef: ego
                Maneuver:
                  - name: ''
                    Event:
                      - name: ''
                        priority: parallel
                        StartTrigger:
                          ConditionGroup:
                            - Condition:
                                - name: ''
                                  delay: 0
                                  conditionEdge: none
                                  ByEntityCondition:
                                    TriggeringEntities:
                                      triggeringEntitiesRule: any
                                      EntityRef:
                                        - entityRef: ego
                                    EntityCondition:
                                      RelativeSpeedCondition:
                                        entityRef: Npc1
                                        direction: longitudinal
                                        rule: lessThan
                                        value: 0.05
                                - name: ''
                                  delay: 0
                                  conditionEdge: none
                                  ByEntityCondition:
                                    TriggeringEntities:
                                      triggeringEntitiesRule: any
                                      EntityRef:
                                        - entityRef: ego
                                    EntityCondition:
                                      ReachPositionCondition:
                                        Position:
                                          LanePosition:
                                            roadId: ''
                                            laneId: '5230'
                                            s: 170
                                            offset: 0
                                            Orientation:
                                              type: relative
                                              h: 0
                                              p: -0.0
                                              r: 0
                                        tolerance: 1
                        Action:
                          - name: ''
                            UserDefinedAction:
                              CustomCommandAction:
                                type: exitSuccess
                      - name: ''
                        priority: parallel
                        StartTrigger:
                          ConditionGroup:
                            - Condition:
                                - name: ''
                                  delay: 0
                                  conditionEdge: none
                                  ByValueCondition:
                                    SimulationTimeCondition:
                                      value: 180
                                      rule: greaterThan
                            - Condition:
                                - name: ''
                                  delay: 0
                                  conditionEdge: none
                                  ByEntityCondition:
                                    TriggeringEntities:
                                      triggeringEntitiesRule: any
                                      EntityRef:
                                        - entityRef: ego
                                    EntityCondition:
                                      StandStillCondition:
                                        duration: 60
                            - Condition:
                                - name: ''
                                  delay: 0
                                  conditionEdge: none
                                  ByEntityCondition:
                                    TriggeringEntities:
                                      triggeringEntitiesRule: any
                                      EntityRef:
                                        - entityRef: ego
                                    EntityCondition:
                                      CollisionCondition:
                                        EntityRef:
                                          entityRef: Npc1
                            - Condition:
                                - name: ''
                                  delay: 0
                                  conditionEdge: none
                                  ByEntityCondition:
                                    TriggeringEntities:
                                      triggeringEntitiesRule: any
                                      EntityRef:
                                        - entityRef: ego
                                    EntityCondition:
                                      AccelerationCondition:
                                        rule: lessThan
                                        value: $amin_ego
                            - Condition:
                                - name: ''
                                  delay: 0
                                  conditionEdge: none
                                  ByValueCondition:
                                    StoryboardElementStateCondition:
                                      state: startTransition
                                      storyboardElementType: act
                                      storyboardElementRef: act_spawn_npc
                                - name: ''
                                  delay: 0
                                  conditionEdge: none
                                  ByEntityCondition:
                                    TriggeringEntities:
                                      triggeringEntitiesRule: any
                                      EntityRef:
                                        - entityRef: ego
                                    EntityCondition:
                                      SpeedCondition:
                                        rule: lessThan
                                        value: 0.001
                                - name: ''
                                  delay: 0
                                  conditionEdge: none
                                  ByEntityCondition:
                                    TriggeringEntities:
                                      triggeringEntitiesRule: any
                                      EntityRef:
                                        - entityRef: ego
                                    EntityCondition:
                                      DistanceCondition:
                                        Position:
                                          LanePosition:
                                            roadId: ''
                                            laneId: '5230'
                                            s: 170
                                            offset: 0
                                            Orientation:
                                              type: relative
                                              h: 0
                                              p: -0.0
                                              r: 0
                                        value: 1
                                        freespace: true
                                        relativeDistanceType: longitudinal
                                        coordinateSystem: lane
                                        rule: greaterThan
                                - name: ''
                                  delay: 0
                                  conditionEdge: none
                                  ByEntityCondition:
                                    TriggeringEntities:
                                      triggeringEntitiesRule: any
                                      EntityRef:
                                        - entityRef: ego
                                    EntityCondition:
                                      CollisionCondition:
                                        EntityRef:
                                          entityRef: Npc1
                        Action:
                          - name: ''
                            UserDefinedAction:
                              CustomCommandAction:
                                type: exitFailure
            StartTrigger:
              ConditionGroup:
                - Condition:
                    - name: ''
                      delay: 0
                      conditionEdge: none
                      ByValueCondition:
                        SimulationTimeCondition:
                          value: 0
                          rule: greaterThan
    StopTrigger:
      ConditionGroup: []