# Local-mode goal for bg_av_1's vehicle agent (acb_pilot poses format), for testing its
# stack with no scenario: BG_RELAY= BG_GOAL_POSES_FILE=$PWD/scenarios/bg_av_1_poses.yaml
# just bg-av. In a scenario the goal comes from town01_two_av.xosc (bg_av_1, controller
# `agent`), which uses the same pose: west along lanelet 6583 of Town01, from x=230 to
# x=110 at y=-129.8 (ROS frame, yaw 180 deg). The agent needs the vehicle in CARLA, which
# only a scenario spawns, so local mode needs one placed by hand (role_name bg_av_1).
#
# This is the ego's own lane. The AV starts 90 m ahead of the ego and finishes 25 m past
# where the ego stops, so the two share the road for most of the run without the parked
# AV blocking the ego's last stretch.
#
# Direction matters as much as position: lanelet 6583 runs x 325.6 -> 101.4, so a goal
# east of the vehicle, or a vehicle facing east, gives "The planned route is empty".
goal_pose:
  x: 110.0
  y: -129.8
  z: 0.0
  qx: 0.0
  qy: 0.0
  qz: 1.0
  qw: 0.0
