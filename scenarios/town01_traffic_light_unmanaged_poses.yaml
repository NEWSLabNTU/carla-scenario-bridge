# Goal for the ego's pilot in scenarios/town01_traffic_light_unmanaged.xosc (acb_pilot
# auto_drive format; phase 013, made whole in 015 step 5).
#
# The unmanaged copy of town01_traffic_light.xosc has no ego AcquirePositionAction (an
# error with managed_ego:=false), so its goal lives here instead. It is the managed
# scenario's AcquirePositionAction verbatim:
#   <WorldPosition x="88.4" y="-100.0" z="0.0" h="-1.5708" .../>
# h = -90 deg -> qz = sin(h/2) = -0.7071, qw = cos(h/2) = 0.7071.
# The scenario's ReachPositionCondition scores the same point (tolerance 6 m); keep the
# two in sync by hand.
#
#   EGO_MANAGED=false \
#   EGO_GOAL_POSES_FILE=$PWD/scenarios/town01_traffic_light_unmanaged_poses.yaml just ego-av
goal_pose:
  x: 88.4
  y: -100.0
  z: 0.0
  qx: 0.0
  qy: 0.0
  qz: -0.7071
  qw: 0.7071
