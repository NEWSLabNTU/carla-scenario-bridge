[package]
name = "csb_core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The scenario bridge's simulator-free core: SSv2's protocol, the world protocol, the SimBackend seam and the policy every world shares"

[lib]
path = "src/lib.rs"

[dependencies]
# ZMQ: the world protocol's client and server shells, the agent relay link
zmq = "0.10"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
# Lanelet2 maps are OSM XML; roxmltree matches acb_bridge's parser choice
roxmltree = "0.20"
tracing = "0.1"
eyre = "0.6"
libc = "0.2"

[build-dependencies]
prost-build = "0.13"
