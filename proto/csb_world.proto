// csb's world protocol (roadmap 037): carla-scenario-bridge (`IsaacBackend`, REQ) and the
// Isaac Sim world server (`src/csb_isaac`, REP), ZMQ on localhost, one Request and one Reply
// per round trip.
//
// Frames: the server's world frame is right-handed and Z-up, metres and radians (ROS's); csb
// subtracts the map origin, so the server never sees map coordinates. Poses are at the SSv2
// entity origin; the declared box sits around it.
//
// Lockstep: nothing advances between requests. `Step` applies the poses it carries, runs
// `substeps` physics steps of `dt` (rendering on the last when `render`), and replies with
// every entity's state after them and the contacts they had.
//
// Bump PROTOCOL_VERSION (csb `backend/isaac`, server `csb_isaac/protocol.py`) on any change a
// peer of the other version would misread; `Hello` refuses a mismatch with both versions.
// Version 2 (roadmap 044): tracked bodies (`Motion`, `Twist`, teleport, the kinematic
// fallback) and contacts per reporting side.

syntax = "proto3";

package csb_world;

message Vec3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Quat {
  double x = 1;
  double y = 2;
  double z = 3;
  double w = 4;
}

message Pose {
  Vec3 position = 1;
  Quat orientation = 2;
}

enum Kind {
  KIND_UNSPECIFIED = 0;
  EGO = 1;
  VEHICLE = 2;
  PEDESTRIAN = 3;
  MISC_OBJECT = 4;
}

message Hello {
  uint32 protocol_version = 1;
}

message HelloReply {
  uint32 protocol_version = 1;
  // Isaac Sim's version, for the log.
  string isaac_version = 2;
}

// Replace the world: every entity is gone after it, the clock goes on.
message LoadWorld {
  // A USD stage to reference as the environment; empty is a flat ground plane at z = 0.
  string usd = 1;
  // Prims of the environment a body rests on (terrain, road surface). Contacts with them
  // are not reported; the flat ground plane is always one.
  repeated string ground_paths = 2;
}

// How a body moves (roadmap 044).
enum Motion {
  // Kinematic: posed by every `EntityPose`, pushed by nothing (037's every entity).
  KINEMATIC = 0;
  // A dynamic body under gravity on the road, driven by the velocity each `EntityPose`
  // carries (`twist`), as CARLA's `set_target_velocity`: contacts hold it back and push it.
  // It reports its contacts, and its state carries its velocity.
  TRACKED = 1;
}

// One entity: a body at `pose` with a box collider, moving as `motion` says. The ego and
// tracked bodies report contacts.
message Spawn {
  string name = 1;
  Kind kind = 2;
  // SSv2's subtype (`car`, `truck`, ...), for the body's look; empty when unknown.
  string subtype = 3;
  // The declared box: its centre from the entity origin, and its length, width, height.
  Vec3 box_center = 4;
  Vec3 box_dimensions = 5;
  Pose pose = 6;
  // What the body looks like: a CARLA blueprint id (`vehicle.tesla.model3`), SSv2's asset
  // key after csb's `blueprint_map`. A server with that vehicle's exported USD renders it on
  // the entity (render only: the box stays the collider); empty or unknown, the box shows.
  // Added without a version bump: a server that predates it ignores it.
  string model = 7;
  Motion motion = 8;
}

message SpawnReply {
  // Nonzero, unique for the server's lifetime.
  uint32 handle = 1;
}

message Despawn {
  uint32 handle = 1;
}

message Twist {
  // World frame, at the entity origin: m/s and rad/s.
  Vec3 linear = 1;
  Vec3 angular = 2;
}

// What the next step does with one body. A kinematic body goes to `pose`. A tracked body
// takes `twist` before the substeps (its pose is ignored unless `teleport`); with `teleport`
// it is first put at `pose`; with `kinematic` it is kinematic from this step on (csb's
// fallback for a blocked body, 044) and goes to `pose`.
message EntityPose {
  uint32 handle = 1;
  Pose pose = 2;
  Twist twist = 3;
  bool teleport = 4;
  bool kinematic = 5;
}

message Step {
  repeated EntityPose poses = 1;
  uint32 substeps = 2;
  // Physics step, s.
  double dt = 3;
  bool render = 4;
}

message EntityState {
  uint32 handle = 1;
  // The physics engine's pose of the body after the step.
  Pose pose = 2;
  // The body's velocity after the step, at its origin: a tracked body's and an ego vehicle's
  // (aib's, from its last substep); unset for kinematic bodies.
  Twist twist = 3;
}

// A reporting body (the ego, a tracked body) touching another at any substep of the step,
// once per pair and reporting side: two reporters touching each other are two contacts.
message Contact {
  uint32 handle = 1;
  // The other entity's handle; 0 for the environment.
  uint32 other = 2;
  // The other prim's path (the environment's, when `other` is 0).
  string other_path = 3;
  // Total normal impulse over the step, N s.
  double impulse = 4;
}

message StepReply {
  // Simulation time after the step, s: monotonic over the server's lifetime.
  double sim_time = 1;
  // Steps served, over the server's lifetime.
  uint64 frame = 2;
  repeated EntityState states = 3;
  repeated Contact contacts = 4;
}

message Shutdown {}

message Request {
  oneof request {
    Hello hello = 1;
    LoadWorld load_world = 2;
    Spawn spawn = 3;
    Despawn despawn = 4;
    Step step = 5;
    Shutdown shutdown = 6;
  }
}

message Reply {
  bool ok = 1;
  // Why not, when `ok` is false: csb's reply to SSv2 carries it.
  string error = 2;
  oneof reply {
    HelloReply hello = 3;
    SpawnReply spawn = 4;
    StepReply step = 5;
  }
}
