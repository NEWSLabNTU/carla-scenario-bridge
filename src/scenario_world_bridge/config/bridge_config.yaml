# The scenario bridge's configuration (roadmap 046): SSv2 on one side, one world server on
# the other. What a simulator needs is its world server's: CARLA's is swb_carla_world.yaml
# (package swb_carla_world), Isaac's takes its arguments from swb_isaac_world.launch.xml.
#
# The bridge reads the file its ROS parameter `config_file` names (launch arg
# `config_file:=`, default this installed copy). Precedence: ROS parameters > environment >
# this file > built-in default. A missing file is fine; a malformed one is fatal, and so is
# a key that belongs to a world server's file (it is named, with where it went).

# The world server the bridge drives: whichever simulator answers there (CARLA's world server
# on 5591 by default, Isaac's on 5590). The ROS parameters world_endpoint, world_render,
# world_request_timeout_seconds and world_load_timeout_seconds override these. A request the
# server does not answer within its timeout ends the bridge for a fresh one (034); the CARLA
# launch raises both timeouts above CARLA's own watchdogs. load_timeout_seconds covers
# LoadWorld, an ego's Spawn (an Isaac ego waits for its sensors, 038) and the weather.
# render: ask the server to render each frame (Isaac: off unless you watch it; a render
# costs 3-5 ms of every frame).
world:
  endpoint: "tcp://127.0.0.1:5590"
  request_timeout_seconds: 10
  load_timeout_seconds: 120
  render: false

# SSv2 ZMQ server. Overridden by SSV2_PORT.
ssv2:
  port: 5555
# The scenario ego.
ego:
  # The name the simulator gives the ego vehicle (CARLA's role_name): its vehicle bridge
  # finds it by this. The CARLA world server's swb_carla_world.yaml must say the same.
  role_name: "hero"
# SSv2 asset key -> the model a world server dresses the entity in (a CARLA blueprint id,
# which the Isaac world server's catalogue knows too). The CARLA world server maps keys
# itself, from its own blueprint_map.
#
# SSv2 asset keys are not CARLA blueprint names in general. A key that already names a
# blueprint (e.g. vehicle.volkswagen.t2) passes straight through and needs no entry here;
# anything else needs a translation, or the spawn falls back to a default for its kind and
# warns.
blueprint_map:
  sample_vehicle: "vehicle.tesla.model3"
# Entities whose controller is `agent` (background AVs, each driven by its own Autoware):
# the bridge spawns the vehicle with role_name = the entity name and forwards the scenario's
# goals to the agent registered with this agent relay under that name
# (docs/design/scenario-authoring.md). The ROS parameter `agent_relay` overrides it;
# simulation.launch.xml points it at the relay it starts. Background AVs used to be listed
# here (`background_avs`); that key is now refused -- declare them in the scenario.
agent_relay: "tcp://localhost:5560"
# Weather (roadmap 018), for a world server that has one (CARLA's): a preset name -- ClearNoon, CloudyNoon, WetNoon,
# WetCloudyNoon, SoftRainNoon, MidRainyNoon, HardRainNoon, the same for Sunset (MidRainSunset)
# and Night (MidRainyNight), or DustStorm. Applied on connect and again after every map load,
# since each load resets CARLA to the town's default (Town01's is overcast and raining).
# Empty leaves CARLA's. The ROS parameter / launch arg `weather` overrides it, and
# `/scenario_world_bridge/set_weather` replaces it at run time (also kept across map loads). Sent to the
# world server when the bridge connects; the server keeps it across map loads.
weather: ""
# How SSv2-driven NPC vehicles (and, on CARLA, pedestrians) move (roadmaps 023, 044):
#   tracked    (default) physics on, driven toward SSv2's pose with its velocity (p95 within
#              0.2 m), snapped back past 0.5 m / 5 deg: real velocity, walk cycles, physical
#              contacts; an NPC ramming the ego pushes with its declared acceleration
#   kinematic  fallback: physics off, teleported to SSv2's pose each frame (exact poses and
#              the cheapest CARLA tick; CARLA reads them at 0 m/s, they cannot be pushed,
#              walkers glide)
# Misc objects, simulator-autopilot and agent vehicles and the ego are not affected. The
# ROS parameter / launch arg `npc_motion` overrides it.
npc_motion: tracked
# Gap trace (roadmap 024): one JSON Lines file per Initialize,
# <gap_trace_dir>/<UTC time>_<episode>.jsonl -- per entity its declared and CARLA boxes, per
# SSv2 frame both worlds' poses, every CARLA contact -- for the offline oracle (gap_oracle).
# Format: docs/design/gap-campaign.md, appendix. Diagnostic only: no reply to SSv2 changes,
# and a slow disk drops frames (counted in the file's end line) rather than slowing a frame.
# Empty = no trace (the default). The ROS parameter / launch arg `gap_trace_dir` overrides it.
gap_trace_dir: ""

# Where each ego run's contacts are written as JSON, for `ros2 run swb_launch
# physical_verdict` and `run_suite --physical-verdict` (roadmap 021). Unset: $ROS_HOME/swb/contacts
# (~/.ros/swb/contacts). "off": no reports. Newest 500 kept. On CARLA they need
# swb_carla_world.yaml's collision_monitor.
# contact_report_dir: off
