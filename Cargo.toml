[workspace]
resolver = "2"
members = [
    "src/scenario_world_bridge",
]
# Submodules with workspaces of their own (roadmap 051): their crates are path dependencies
# here, built and tested in their own workspace.
exclude = ["src/swb_world_protocol", "src/swb_carla_world"]

[profile.dev-release]
inherits = "release"
debug = true
debug-assertions = true
