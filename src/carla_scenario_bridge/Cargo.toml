[package]
name = "carla_scenario_bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The scenario bridge: SSv2 on one side, a world server over the world protocol on the other"

[[bin]]
name = "carla_scenario_bridge"
path = "src/main.rs"

# Probe or check a world server (roadmap 046).
[[bin]]
name = "csb_world_check"
path = "src/bin/csb_world_check.rs"

[package.metadata.ros]
install_to_share = ["config", "launch"]

[dependencies]
# The simulator-free core: SSv2's protocol, the world protocol, the policy (roadmap 046). No
# simulator's client library anywhere in this package's dependency graph.
csb_core = { path = "../csb_core" }

# ZMQ
zmq = "0.10"

# ROS: the world configuration services (roadmap 018). csb_interfaces is generated by
# colcon-cargo-ros2 from src/csb_interfaces and patched in through .cargo/config.toml.
rclrs = "0.7"
csb_interfaces = "*"
futures = "0.3"

prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
eyre = "0.6"
color-eyre = "0.6"
ctrlc = { version = "3", features = ["termination"] }
# `_exit` after a request that never returned (roadmap 034).
libc = "0.2"
