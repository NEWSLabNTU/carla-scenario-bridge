[workspace]
resolver = "2"
members = [
    "src/carla_scenario_bridge",
]

[workspace.dependencies]
# The feature names the CARLA this workspace talks to; carla-rust refuses to build without
# one (CARLA_VERSION, when set, still overrides it).
carla = { version = "0.14.0", features = ["carla-0916"] }

[patch.crates-io]
# 68aef48 stops a sensor before destroying it in destroy_with_children: an orphaned
# sensor stream makes 0.9.16 log "Invalid session: no stream available with id N" in a
# hot loop (~10 MB/s), starving the simulation and eventually segfaulting the server.
# See src/autoware_carla_bridge/docs/issues/015.
# 2718365 pulls the carla-rust/0.9.16-3 prebuilt, whose libcarla contains the worker-thread
# exception containment fix: LightManager RPC callbacks on the episode worker thread threw
# uncaught TimeoutExceptions when CARLA died mid-run, terminating this process before its
# reconnect logic could act. (Earlier: 575f6aa added Debug on generated enums and
# *_from_ffi_ref accessors, which World::ground_projection needs.)
# bd9c7b3 stops an empty FFI container from aborting the process: slice::from_raw_parts
# rejects a null pointer even at length zero, and an actor with no attributes -- or a lidar
# frame with no returns -- produced exactly that. The abort does not unwind, so a caller
# cannot defend against it.
# e06de1c selects the CARLA version with a cargo feature (carla-0916 above) instead of the
# CARLA_VERSION env var alone, whose absence silently built the 0.10 API.
carla = { git = "https://github.com/jerry73204/carla-rust.git", rev = "e06de1c" }

[profile.dev-release]
inherits = "release"
debug = true
debug-assertions = true
